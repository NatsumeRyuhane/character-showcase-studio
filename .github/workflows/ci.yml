name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: node tools/build.mjs
      - name: Check
        working-directory: frontend
        run: node tools/check.mjs

  launcher:
    name: Launcher (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install launcher dependencies
        run: python -m pip install -r deploy/launcher/requirements.txt
      - name: Launcher tests
        run: python -m unittest discover -s deploy/launcher/tests -v
      - name: start.sh installs missing dependencies and runs a subcommand
        if: runner.os != 'Windows'
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          PATH="$RUNNER_TEMP/fresh/bin:$PATH" ./start.sh status
          PATH="$RUNNER_TEMP/fresh/bin:$PATH" ./start.sh doctor
      - name: start.cmd runs a subcommand without pausing
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call start.cmd status || exit /b 1
          call start.cmd doctor || exit /b 1
