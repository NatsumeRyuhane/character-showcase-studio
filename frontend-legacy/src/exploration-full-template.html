<div id="character-directions">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Manrope:wght@500;700;800&family=Nunito:wght@600;800;900&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap');
